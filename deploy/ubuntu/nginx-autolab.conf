server {
    listen 80;
    server_name autolab.glasscenter.kg 5.129.213.43;

    client_max_body_size 40m;
    client_body_timeout 180s;
    send_timeout 180s;

    location /static/ {
        alias /opt/autolab/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        auth_request /_media_auth;
        alias /opt/autolab/backend/storage/;
        add_header Cache-Control "private, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /_media_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/media-authorize/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Session-Key $http_x_session_key;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
