thod": ["п. 1.4.8.4.", "ТР ТС 018/2011"], "norm": ["Если прямой обзор является недостаточным, необходимо устанавливать оптические или другие устройства В случае служебной двери в задней торцевой части ТС вместимостью не более 22 пассажиров , водитель способен обнаружить присутствие объекта высотой 1,3 м, находящегося на расстоянии 1 м позади ТС."], "actual": [], "section": false}, {"n": 88, "name": ["- взаиморасположение служебной двери и других внутренних дверей (туалет)"], "method": ["п. 1.4.8.5.", "ТР ТС 018/2011"], "norm": ["Если служебная дверь прилегает к двери туалета или другого внутреннего отделения, служебная дверь должна быть оборудована устройством, предотвращающим ее непреднамеренное открывание."], "actual": [], "section": false}, {"n": 89, "name": ["-Дополнительные технические требования к автоматическим служебным дверям"], "method": ["п. 1.4.9", "ТР ТС 018/2011"], "norm": ["Механизмы открывания каждой автоматической служебной двери должны приводиться в действие и отключаться только водителем с его сиденья. Приведение в действие и отключение может быть либо прямым, при помощи выключателя, либо косвенным, например, путем открывания и закрывания передней служебной двери."], "actual": [], "section": false}, {"n": 90, "name": ["Закрывание автоматических служебных дверей"], "method": ["п. 1.4.10.1", "ТР ТС 018/2011"], "norm": ["автоматическая служебная дверь после открывание, должна закрыться вновь автоматически по истечении определенного периода времени"], "actual": [], "section": true}, {"n": 91, "name": ["Закрывание автоматической двери во время входа или выхода пассажира"], "method": ["п. 1.4.10.2", "ТР ТС 018/2011"], "norm": ["автоматическая служебная дверь должен прерываться автоматически и дверь должна возвращаться в открытое положение"], "actual": [], "section": true}, {"n": 92, "name": ["отключения водителем механизмов открывания автоматической служебной двери"], "method": ["п. 1.4.10.3", "ТР ТС 018/2011"], "norm": ["открытые двери должны закрыться, автоматически по истечении определенного периода времени"], "actual": [], "section": false}, {"n": 93, "name": ["Требования к запасным дверям"], "method": [], "norm": [], "actual": [], "section": true}, {"n": 94, "name": ["Открывание запасных дверей изнутри и снаружи, когда транспортное средство находится в неподвижном состоянии."], "method": ["п. 1.4.11.1", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.11"], "norm": ["Запасные двери должны легко открываться.", "Однако это требование не должно толковаться как исключающее возможность запирания двери снаружи при условии, что она всегда может быть открыта изнутри при помощи обычного механизма открывания двери."], "actual": [], "section": true}, {"n": 95, "name": ["используемые в качестве таковых запасных дверей"], "method": ["п. 1.4.11.2", "ТР ТС 018/2011"], "norm": ["не должны иметь механического привода, кроме тех случаев, когда после приведения в действие и возвращения в обычное положение механизма управления, двери не закрываются вновь, пока водитель не включит механизм их закрывания. Они также не должны быть раздвижного типа, кроме как на транспортных средствах вместимостью не более 22 пассажиров."], "actual": [], "section": false}, {"n": 96, "name": ["Навесные запасные двери, установленные на боковой части", "Ремни, ограничивающие открывание двери, цепочки или другие ограничивающие устройства"], "method": ["п. 1.4.11.3", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.11"], "norm": ["должны навешиваться передней частью и открываться наружу.", "допускаются, если они не препятствуют свободному открыванию дверей на угол не менее 100° и позволяют им оставаться в этом положении. Если имеются достаточные средства для обеспечения свободного доступа к запасной двери, требование в отношении минимального угла 100° не применяется."], "actual": [], "section": true}, {"n": 97, "name": ["устройства, предотвращающие непреднамеренное открывание запасных дверей"], "method": ["п. 1.4.11.4", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.7,3"], "norm": ["Запасные двери должны быть оборудованы устройством, предотвращающим их непреднамеренное открывание. Однако это требование не применяется, если запасная дверь закрывается автоматически при движении транспортного средства со скоростью более 5 км/ч."], "actual": [], "section": false}, {"n": 98, "name": ["оснащенность устройством, предупреждающим водителя о том, что они закрыты неплотно."], "method": ["п. 1.4.11.5", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.11,5"], "norm": ["Все запасные двери должны быть оснащены звуковым устройством"], "actual": [], "section": false}, {"n": 99, "name": ["Требования к запасным окнам"], "method": [], "norm": [], "actual": [], "section": true}, {"n": 100, "name": ["Открывание навесного или откидного запасного окна"], "method": ["п. 1.4.12.1", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.12,1"], "norm": ["Любое навесное или откидное запасное окно должно открываться наружу."], "actual": [], "section": true}, {"n": 101, "name": ["Любое запасное окно должно"], "method": ["п. 1.4.12.2", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.12,1,2,1"], "norm": ["легко и быстро открываться изнутри и снаружи транспортного средства при помощи соответствующего приспособления", "Либо иметь легко разбиваемое предохранительное стекло"], "actual": [], "section": true}, {"n": 102, "name": ["Каждое запасное окно, которое может быть заперто снаружи"], "method": ["п. 1.4.12.3", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.12,12"], "norm": ["должно быть сконструировано таким образом, чтобы его в любое время можно было открыть изнутри транспортного средства."], "actual": [], "section": true}, {"n": 103, "name": ["Запасное навесное окно с петлями, установленными горизонтально в верхней кромке"], "method": ["п. 1.4.12.4", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.12,3"], "norm": ["должно быть оборудовано соответствующим механизмом для его удержания в полностью открытом положении.", "должно открываться и закрываться таким образом, чтобы не препятствовать свободному доступу внутрь транспортного средства или выхода из него"], "actual": [], "section": true}, {"n": 104, "name": ["Требования к аварийным люкам"], "method": [], "norm": [], "actual": [], "section": true}, {"n": 105, "name": ["открывание и закрывание аварийных люков"], "method": ["п. 1.4.13.1", "ТР ТС 018/2011 ГОСТ 33670—2015 Таблица А.9.13,1"], "norm": ["Каждый аварийный люк должен открываться и закрываться таким образом, чтобы не препятствовать свободному доступу внутрь транспортного средства или выхода из него."], "actual": [], "section": false}, {"n": 106, "name": ["Требования к запасным люкам в крыше"], "method": ["п. 1.4.13.2", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.13,2"], "norm": ["должны быть откидными, навесными или изготовленными из легко разбиваемого предохранительного стекла."], "actual": [], "section": true}, {"n": 107, "name": ["Люки откидного типа"], "method": ["п. 1.4.13.3", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.13,3"], "norm": ["не должны полностью отделяться от транспортного средства при открывании, чтобы люк не представлял никакой опасности для других участников дорожного движения. Откидные люки в полу должны открываться только внутрь пассажирского салона."], "actual": [], "section": true}, {"n": 108, "name": ["Аварийные люки"], "method": ["п. 1.4.13.4", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.13,4"], "norm": ["должны легко открываться или сниматься как изнутри, так и снаружи. В случае легко разбиваемого люка поблизости от него должно быть установлено устройство, легко доступное для лиц, находящихся в транспортном средстве, с тем чтобы люк можно было разбить."], "actual": [], "section": true}, {"n": 109, "name": ["Надписи"], "method": [], "norm": [], "actual": [], "section": true}, {"n": 110, "name": ["обозначение надписью изнутри и снаружи  запасного выхода транспортного средства"], "method": ["п. 1.4.14.1", "ТР ТС 018/2011", "ГОСТ 33670—2015 Таблица А.9.14,1"], "norm": ["должен обознач function makeHeaderPage(){var page=pageShell('page-1');page.innerHTML='<div class="doc-header"><div class="accreditation-mark">Знак<br>аккредитации</div><div class="header-copy"><div class="org-title">Органа контроля Государственного Предприятия<br>«Центр технического назначения Главного управления по<br>обеспечению безопасности дорожного движения МВД<br>Кыргызской Республики»</div><div class="place">Место проведения испытаний: Кыргызстан, г. Ош, ул. Навои 2а</div><div class="header-divider"></div><div class="certificate">АТТЕСТАТ АККРЕДИТАЦИИ № KG <span class="line-fill"></span></div></div></div><div class="protocol-title">ПРОТОКОЛ ТЕХНИЧЕСКОЙ ЭКСПЕРТИЗЫ</div><div class="protocol-meta">№ <input data-field="protocol_number" aria-label="Номер протокола" class="inline-input number-input"> от <input data-field="protocol_date" aria-label="Дата протокола" class="inline-input date-text"> г.</div><table class="info-table"><colgroup><col class="label-col"><col class="value-col"></colgroup><tbody><tr class="fixed-row" data-info-row="0"><td>Заказчик</td><td><textarea data-field="customer" aria-label="Заказчик"></textarea></td></tr><tr class="fixed-row" data-info-row="1"><td>Наименование объекта испытаний</td><td><textarea data-field="object_name" aria-label="Наименование объекта испытаний"></textarea></td></tr><tr class="fixed-row" data-info-row="2"><td>Тип транспортного средства</td><td><textarea data-field="vehicle_type" aria-label="Тип транспортного средства"></textarea></td></tr><tr class="fixed-row" data-info-row="3"><td>Изготовитель (страна, фирма)</td><td><textarea data-field="manufacturer" aria-label="Изготовитель"></textarea></td></tr><tr class="fixed-row" data-info-row="4"><td>Идентификационный номер (VIN) или номерных агрегатов и отсутствии VIN</td><td><textarea data-field="vin" aria-label="VIN или номер агрегатов"></textarea></td></tr><tr class="fixed-row" data-info-row="5"><td>Основание для испытаний (протокол идентификации ТС №/дата)</td><td><textarea data-field="test_basis" aria-label="Основание для испытаний"></textarea></td></tr><tr class="fixed-row" data-info-row="6"><td>Дата поступления образцов</td><td><input data-field="sample_received" aria-label="Дата поступления образцов"></td></tr><tr class="fixed-row" data-info-row="7"><td>Начало проведения испытаний</td><td><input data-field="test_started" aria-label="Начало испытаний"></td></tr><tr class="fixed-row" data-info-row="8"><td>Окончание проведения  испытаний</td><td><input data-field="test_finished" aria-label="Окончание испытаний"></td></tr><tr class="fixed-row" data-info-row="9"><td>Нормативный док мент</td><td>ТР ТС № 018/2011, ГОСТ 33670-2015, ГОСТ 33997-2016</td></tr><tr class="fixed-row" data-info-row="10"><td>Вид испытаний</td><td>Контрольные</td></tr><tr class="conditions"><td>Условия проведения испытаний</td><td><label>Температура С, <input data-field="temperature" class="short-input" aria-label="Температура"></label><br><label>Относительная влажность&nbsp; % <input data-field="humidity" class="short-input" aria-label="Относительная влажность"></label></td></tr></tbody></table><div class="category">(категории M3)</div>';return page;}
function makeFooter(){var box=document.createElement('div');box.className='document-footer';box.innerHTML='<div class="note-title">Примечание</div><div class="notes-area"><textarea data-field="notes" aria-label="Примечание"></textarea></div><div class="conclusion"><span class="conclusion-result">Соответствует / не соответствует</span> требованиям Технического Регламента Таможенного Союза «О безопасности колесных транспортных средств» ТР ТС 018/2011.</div><div class="signature-line"><span>Технический эксперт</span><span class="signature-space"></span><input data-field="expert_name" aria-label="ФИО технического эксперта" class="expert-input"></div><div class="signature-caption"><span>Подпись</span><span>Ф.И.О.</span></div>';return box;}
function appendTable(page){var table=tableShell();page.appendChild(table);return table.querySelector('tbody');}function paginate(){root.innerHTML='';var page=makeHeaderPage();root.appendChild(page);var tbody=appendTable(page);rows.forEach(function(row){var tr=makeRow(row);tbody.appendChild(tr);if(page.scrollHeight>page.clientHeight){tbody.removeChild(tr);page=pageShell('page-'+(root.children.length+1));root.appendChild(page);tbody=appendTable(page);tbody.appendChild(tr);}});var footer=makeFooter();page.appendChild(footer);if(page.scrollHeight>page.clientHeight){page.removeChild(footer);var footerPage=pageShell('page-'+(root.children.length+1));root.appendChild(footerPage);footerPage.appendChild(footer);}Array.prototype.forEach.call(root.children,function(page,index){page.dataset.page=String(index+1);});}
function collectDocumentState(){return {fields:Array.prototype.map.call(document.querySelectorAll('[data-field]'),function(el){return {name:el.dataset.field,value:el.value||''};}),actual:Array.prototype.map.call(document.querySelectorAll('.col-actual'),function(cell){var btn=cell.querySelector('.actual-toggle');var input=cell.querySelector('.actual-mm input');return {name:cell.dataset.result||'',state:btn?(btn.dataset.state||''):null,value:input?input.value:null};})};}window.AutolabCollectDocumentState=collectDocumentState;function notifyStateChanged(){clearTimeout(notifyTimer);notifyTimer=setTimeout(function(){if(window.DocumentState&&window.DocumentState.postMessage)window.DocumentState.postMessage(JSON.stringify(collectDocumentState()));},80);}function setToggle(button,state){button.dataset.state=state||'';button.textContent=state==='check'?'✓':(state==='dash'?'-':(state==='cross'?'✕':''));}
function applyDocumentState(raw){if(!raw)return;try{var state=typeof raw==='string'?JSON.parse(raw):raw;(state.fields||[]).forEach(function(item){var el=field(item.name);if(el){el.value=item.value||'';el.classList.toggle('needs-fill',!String(el.value||'').trim());}});(state.actual||[]).forEach(function(item,index){var cell=item.name?document.querySelector('[data-result="'+item.name+'"]'):document.querySelectorAll('.col-actual')[index];if(!cell)return;var btn=cell.querySelector('.actual-toggle');if(btn)setToggle(btn,item.state||'');var input=cell.querySelector('.actual-mm input');if(input&&item.value!==null&&item.value!==undefined)input.value=item.value;});}catch(_){}}
function wireActualCells(){document.querySelectorAll('.actual-toggle').forEach(function(button){button.addEventListener('click',function(){var s=button.dataset.state||'';setToggle(button,s===''?'check':(s==='check'?'dash':(s==='dash'?'cross':'')));notifyStateChanged();});});document.querySelectorAll('.actual-mm input').forEach(function(input){input.addEventListener('input',notifyStateChanged);});}
function setupSignature(){var signature=params.get('signature');var space=document.querySelector('.signature-space');if(!space)return;if(signature){space.classList.add('signed');space.innerHTML='';var img=document.createElement('img');img.alt='Подпись';img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(signature);space.appendChild(img);}else{var btn=document.createElement('button');btn.type='button';btn.className='signature-button';btn.textContent='Подписать';btn.addEventListener('click',function(){notifyStateChanged();if(window.SignDocument&&window.SignDocument.postMessage)window.SignDocument.postMessage('sign');});space.appendChild(btn);}}
function fillAutoFields(){var date=today();setValue('protocol_date',date,true);setValue('sample_received',date,true);setValue('object_name',params.get('brand')||'',false);setValue('manufacturer',params.get('country')||'',false);setValue('vin',params.get('vin')||'',false);setValue('expert_name',params.get('expert_name')||'',false);['object_name','manufacturer','vin','temperature','humidity','expert_name'].forEach(function(name){markIfEmpty(field(name));});}
paginate();wireActualCells();fillAutoFields();setupSignature();applyDocumentState(params.get('state'));fillAutoFields();notifyStateChanged();
})();</script></body></html>
