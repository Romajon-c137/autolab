ортных средств категорий M1, М2 и М3 классов II, III и В, категорий N, L6 и L7 (с автомобильной компоновкой) за исключением сидений, предназначенных для использования исключительно в неподвижном транспортном средстве оснащаются ремнями безопасности"], "actual": [], "section": true}, {"n": 88, "name": ["С ремнями безопасности не допускается использование втягивающих устройств"], "method": ["приложение №4", "п 3.2.13. ТР ТС 018 /2011", "ГОСТ 33670—2015 А.13.13"], "norm": ["-Которые не имеют регулятора длины вытянутой лямки", "- Которые требуют приведения в действие вручную приспособления для получения желаемой длины лямки и которые автоматически запираются после достижения пользователем желаемой длины.", "- Ремни с креплением в трех точках и втягивающими устройствами имеют, по крайней мере, одно втягивающее устройство для диагональной лямки."], "actual": [], "section": true}, {"n": 89, "name": ["Наличие знака предупреждения каждого пассажирского сиденья, оснащенного подушкой безопасности, за исключением если транспортное средство оборудовано сенсорным механизмом, который автоматически определяет наличие детского удерживающего устройства, установленного против направления движения,"], "method": ["приложение №4 п 3.2.14. ТР ТС 018 /2011", "ГОСТ 33670—2015 А.13.14"], "norm": ["для каждого пассажирского сиденья, оснащенного подушкой безопасности, предусматривается знак предупреждения против использования на нем детского удерживающего устройства, установленного против направления движения. Предупреждающая этикетка в виде пиктограммы, которая может содержать пояснительный текст, надежно прикрепляется и размещается таким образом, чтобы ее могло видеть лицо, намеревающееся установить на данном сиденье детское удерживающее устройство, расположенное против направления движения предупреждающий знак должен быть виден во всех случаях, в том числе, при закрытой двери."], "actual": [], "section": true}, {"n": 90, "name": ["Установка ремней безопасности"], "method": ["приложение №4 п function applyDocumentState(raw){if(!raw)return;try{var state=typeof raw==='string'?JSON.parse(raw):raw;(state.fields||[]).forEach(function(item){var el=field(item.name);if(el){el.value=item.value||'';el.classList.toggle('needs-fill',!String(el.value||'').trim());}});(state.actual||[]).forEach(function(item,index){var cell=item.name?document.querySelector('[data-result="'+item.name+'"]'):document.querySelectorAll('.col-actual')[index];if(!cell)return;var btn=cell.querySelector('.actual-toggle');if(btn)setToggle(btn,item.state||'');var input=cell.querySelector('.actual-mm input');if(input&&item.value!==null&&item.value!==undefined)input.value=item.value;});}catch(_){}}
function wireActualCells(){document.querySelectorAll('.actual-toggle').forEach(function(button){button.addEventListener('click',function(){var s=button.dataset.state||'';setToggle(button,s===''?'check':(s==='check'?'dash':(s==='dash'?'cross':'')));notifyStateChanged();});});document.querySelectorAll('.actual-mm input').forEach(function(input){input.addEventListener('input',notifyStateChanged);});}
function setupSignature(){var signature=params.get('signature');var space=document.querySelector('.signature-space');if(!space)return;if(signature){space.classList.add('signed');space.innerHTML='';var img=document.createElement('img');img.alt='Подпись';img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(signature);space.appendChild(img);}else{var btn=document.createElement('button');btn.type='button';btn.className='signature-button';btn.textContent='Подписать';btn.addEventListener('click',function(){notifyStateChanged();if(window.SignDocument&&window.SignDocument.postMessage)window.SignDocument.postMessage('sign');});space.appendChild(btn);}}
function fillAutoFields(){var date=today();setValue('protocol_date',date,true);setValue('sample_received',date,true);setValue('object_name',params.get('brand')||'',false);setValue('manufacturer',params.get('country')||'',false);setValue('vin',params.get('vin')||'',false);setValue('expert_name',params.get('expert_name')||'',false);['object_name','manufacturer','vin','temperature','humidity','expert_name'].forEach(function(name){markIfEmpty(field(name));});}
paginate();wireActualCells();fillAutoFields();setupSignature();applyDocumentState(params.get('state'));fillAutoFields();notifyStateChanged();
})();</script></body></html>
